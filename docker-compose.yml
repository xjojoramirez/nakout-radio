# `image` points at the artifact CI publishes to GHCR; `build` stays so local
# dev and tests can still build from source. Production pulls the published
# tag: IMAGE_TAG=<sha> docker compose pull && docker compose up -d --no-build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    image: ghcr.io/xjojoramirez/nakout-radio-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8011:8000"
    env_file: ./backend/.env
    volumes:
      - radio_data:/data
      - ./docs/studio:/app/docs/studio:ro
    environment:
      DATABASE_URL: sqlite:////data/radio.db
      CHANGELOG_PATH: /app/docs/studio/changelog.md
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/xjojoramirez/nakout-radio-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:8012:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radio_data:
  caddy_data:
  caddy_config:

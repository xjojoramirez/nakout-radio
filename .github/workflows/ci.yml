name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull request runs supersede each other; pushes to main queue so every
  # merged commit finishes the pipeline (and no promote is cancelled midway).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend - lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck E2E
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend - lint + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Audit dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  images:
    name: Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: nakout-radio-backend
            build_args: ""
          - service: frontend
            context: ./frontend
            image: nakout-radio-frontend
            # Baked into the bundle (canonical URL, sitemap, Open Graph).
            build_args: VITE_SITE_URL=https://nakout.com
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify local image
        if: github.event_name != 'push'
        run: docker image inspect "${{ env.IMAGE }}:${{ github.sha }}" --format '{{.Id}}'

      - name: Verify published image
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.sha }}"

  integration:
    name: Integration - docker compose
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 25
    env:
      DOMAIN: example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write test environment
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          YT_API_KEY=test-youtube-key
          ADMIN_PASSWORD=test-admin-password
          SECRET_KEY=test-secret-key-0123456789abcdef0123456789
          COOKIE_SECURE=false
          LOUDNESS_LOOKUP_ENABLED=false
          ENRICHMENT_ENABLED=false
          EOF

      - name: Build and start stack
        run: docker compose -p nakout-ci up -d --build backend frontend

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8011/api/health > /dev/null; then
              echo "Backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120s"
          docker compose -p nakout-ci ps
          docker compose -p nakout-ci logs backend
          exit 1

      - name: Check public endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8011/api/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8011/api/genres > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8011/api/schedule/today > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8012/ | grep -q '<div id="root"></div>'

      - name: Check reverse proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8012/api/health | grep -q '"status":"ok"'

      - name: Check admin session
        run: |
          set -euo pipefail
          cookie_jar="$(mktemp)"
          curl --fail --silent --show-error --cookie-jar "$cookie_jar" \
            --header 'Content-Type: application/json' \
            --data '{"password":"test-admin-password"}' \
            http://127.0.0.1:8011/api/studio/login | grep -q '"status":"ok"'
          curl --fail --silent --show-error --cookie "$cookie_jar" \
            http://127.0.0.1:8011/api/studio/session | grep -q '"status":"ok"'

      - name: Check migrations
        run: |
          set -euo pipefail
          current="$(docker compose -p nakout-ci exec -T backend alembic current 2>/dev/null)"
          echo "$current"
          grep -q '(head)' <<<"$current"
          docker compose -p nakout-ci exec -T backend alembic check

      - name: Check WebSocket
        run: |
          docker compose -p nakout-ci exec -T backend python - <<'PY'
          import asyncio
          import json

          from websockets.asyncio.client import connect


          async def main() -> None:
              async with connect("ws://frontend/api/ws/listeners") as socket:
                  payload = json.loads(await asyncio.wait_for(socket.recv(), timeout=10))
                  assert payload == {"count": 1}, payload
                  print(f"WebSocket listener count: {payload['count']}")


          asyncio.run(main())
          PY

      - name: Dump logs
        if: failure()
        run: docker compose -p nakout-ci logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p nakout-ci down -v --remove-orphans

  e2e:
    name: E2E - playwright chromium
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 25
    env:
      DOMAIN: example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Write test environment
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          YT_API_KEY=test-youtube-key
          ADMIN_PASSWORD=test-admin-password
          SECRET_KEY=test-secret-key-0123456789abcdef0123456789
          COOKIE_SECURE=false
          LOUDNESS_LOOKUP_ENABLED=false
          ENRICHMENT_ENABLED=false
          EOF

      - name: Build and start stack
        run: docker compose -p nakout-ci up -d --build backend frontend

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8011/api/health > /dev/null; then
              echo "Backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120s"
          docker compose -p nakout-ci ps
          docker compose -p nakout-ci logs backend
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Dump logs
        if: failure()
        run: docker compose -p nakout-ci logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p nakout-ci down -v --remove-orphans

  promote:
    name: Promote - ${{ matrix.service }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [images, integration, e2e]
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: nakout-radio-backend
          - service: frontend
            image: nakout-radio-frontend
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retags the exact image the images job pushed, so `latest` only ever
      # points at a commit that passed every CI stage. No rebuild.
      - name: Move latest to the tested commit
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}"
          docker buildx imagetools inspect "$IMAGE:latest"

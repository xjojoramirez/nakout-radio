name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend - lint + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Audit dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  images:
    name: Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: nakout-radio-backend
            build_args: ""
          - service: frontend
            context: ./frontend
            image: nakout-radio-frontend
            build_args: VITE_SITE_URL=https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify image tag
        run: docker image inspect "${{ matrix.image }}:${{ github.sha }}" --format '{{.Id}}'

  integration:
    name: Integration - docker compose
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 25
    env:
      DOMAIN: example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write test environment
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          YT_API_KEY=test-youtube-key
          ADMIN_PASSWORD=test-admin-password
          SECRET_KEY=test-secret-key-0123456789abcdef0123456789
          COOKIE_SECURE=false
          LOUDNESS_LOOKUP_ENABLED=false
          ENRICHMENT_ENABLED=false
          EOF

      - name: Build and start stack
        run: docker compose -p nakout-ci up -d --build backend frontend

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8011/api/health > /dev/null; then
              echo "Backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120s"
          docker compose -p nakout-ci ps
          docker compose -p nakout-ci logs backend
          exit 1

      - name: Check public endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8011/api/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8011/api/genres > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8011/api/schedule/today > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8012/ | grep -q '<div id="root"></div>'

      - name: Check reverse proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8012/api/health | grep -q '"status":"ok"'

      - name: Check admin session
        run: |
          set -euo pipefail
          cookie_jar="$(mktemp)"
          curl --fail --silent --show-error --cookie-jar "$cookie_jar" \
            --header 'Content-Type: application/json' \
            --data '{"password":"test-admin-password"}' \
            http://127.0.0.1:8011/api/studio/login | grep -q '"status":"ok"'
          curl --fail --silent --show-error --cookie "$cookie_jar" \
            http://127.0.0.1:8011/api/studio/session | grep -q '"status":"ok"'

      - name: Check migrations
        run: |
          set -euo pipefail
          current="$(docker compose -p nakout-ci exec -T backend alembic current 2>/dev/null)"
          echo "$current"
          grep -q '(head)' <<<"$current"
          docker compose -p nakout-ci exec -T backend alembic check

      - name: Check WebSocket
        run: |
          docker compose -p nakout-ci exec -T backend python - <<'PY'
          import asyncio
          import json

          from websockets.asyncio.client import connect


          async def main() -> None:
              async with connect("ws://frontend/api/ws/listeners") as socket:
                  payload = json.loads(await asyncio.wait_for(socket.recv(), timeout=10))
                  assert payload == {"count": 1}, payload
                  print(f"WebSocket listener count: {payload['count']}")


          asyncio.run(main())
          PY

      - name: Dump logs
        if: failure()
        run: docker compose -p nakout-ci logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p nakout-ci down -v --remove-orphans
